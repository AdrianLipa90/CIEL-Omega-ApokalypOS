cielingo_roadmap_version: '2.1'
status: draft_canonical_plan
generated_at: '2026-05-10T14:06:58.425427+00:00'
principles:
- 'Keep technical documentation neutral: no magical, metaphysical, or poetic claims
  in repo artifacts.'
- Treat CIELingo as a typed linguistic-physics data/model system, not as an ordinary
  dictionary.
- Prefer local NOEMA retrieval and structural validation before invoking any GGUF/LLM
  model.
- GGUF/LLM verdicts are advisory teacher-validator signals, not canonical truth.
- Unknown, unresolved, conflict, and needs_review are valid states and must be stored
  explicitly.
- Every new card must enter through card ontology, schema validation, graph comparison,
  and diagnostic reporting.
- If preferred storage fails, write JSON/JSONL fallback plus an explicit report.
