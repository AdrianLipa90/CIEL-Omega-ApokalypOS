risk_register:
- risk: semantic dependency explosion
  mitigation: decrease batch size; maintain conflict/unresolved registry; run graph
    deltas
- risk: LLM/GGUF over-trust
  mitigation: teacher verdict advisory only; canonical status requires structural
    validation
- risk: manual seed treated as authoritative dictionary
  mitigation: use curated_seed/draft/needs_review statuses
- risk: cross-language flattening
  mitigation: case gauge, TAM-E, ontology aspect, scope stack, reconstruction cost
    metrics
- risk: binary storage failure
  mitigation: JSON/JSONL fallback protocol with explicit audit record
- risk: metaphorical language polluting repo claims
  mitigation: technical style policy in roadmap and README
