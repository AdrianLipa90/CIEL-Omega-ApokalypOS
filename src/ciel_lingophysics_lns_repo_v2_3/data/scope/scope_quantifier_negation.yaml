version: '1.5'
layer: scope_quantifier_negation
axiom: scope is an operator stack; surface similarity is not scope equivalence
dimensions:
  quantifier:
    ALL:
      symbol: ∀
      operator: ForAll
      phase: 0.1
      force: 1.0
      class: universal
    EACH:
      symbol: ∀_each
      operator: ForEach
      phase: 0.12
      force: 1.0
      class: distributive_universal
    SOME:
      symbol: ∃
      operator: Exists
      phase: 0.35
      force: 0.72
      class: existential
    MANY:
      symbol: ∃many
      operator: Many
      phase: 0.42
      force: 0.62
      class: vague_quantity
    FEW:
      symbol: ∃few
      operator: Few
      phase: 0.48
      force: 0.55
      class: vague_quantity
    ONE:
      symbol: ∃=1
      operator: ExactlyOne
      phase: 0.55
      force: 0.82
      class: cardinal
    'NO':
      symbol: ¬∃
      operator: 'No'
      phase: 3.141593
      force: 1.0
      class: negative_quantifier
    ANY:
      symbol: ∃/∀?
      operator: Any
      phase: 0.7
      force: 0.45
      class: polarity_sensitive
  negation_position:
    none:
      operator: IdentityPolarity
      phase: 0.0
    outside_quantifier:
      operator: NotOverQuantifier
      phase: 1.570796
    inside_predicate:
      operator: NotOverPredicate
      phase: 2.094395
    quantifier_negative:
      operator: NegativeQuantifier
      phase: 3.141593
    unresolved:
      operator: UnresolvedScope
      phase: 0.785398
