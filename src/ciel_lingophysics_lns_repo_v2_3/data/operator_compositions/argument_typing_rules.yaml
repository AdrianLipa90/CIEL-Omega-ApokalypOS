rules:
- operator: Have
  if_y_type: animal|object
  mode: alienable_possession
  equation: Own(x,y)
- operator: Have
  if_y_type: body_part|component
  mode: inherent_part
  equation: HasPart(x,y)
- operator: Have
  if_y_type: property|measure
  mode: property_assignment
  equation: HasProperty(x,y)
- operator: Have
  if_y_type: problem|state|condition
  mode: state_attachment
  equation: HasState(x,y)
- operator: HowLikeAs
  if_syntax: question_manner
  mode: manner_query
  equation: How(T)->Ask(Manner(T))
- operator: HowLikeAs
  if_syntax: comparison
  mode: similarity
  equation: Like(x,y)->Sim(x,y)
- operator: HowLikeAs
  if_syntax: role_assignment
  mode: role_mapping
  equation: As(x,role)->AssignRole(x,role)
