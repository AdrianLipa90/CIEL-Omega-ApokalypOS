name: pytest-hang-diagnostic

on:
  push:
    branches:
      - fix/base-ci-import-debt-20260905
    paths:
      - .github/workflows/pytest-hang-diagnostic.yml

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .[dev] --no-deps
      - name: Run verbose pytest under hard diagnostic timeout
        run: |
          set -o pipefail
          # Bounded second pass after tmp_path isolation repair.
          timeout --signal=TERM --kill-after=15s 300s pytest -vv -x -s
