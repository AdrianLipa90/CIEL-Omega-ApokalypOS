name: CQCL Living v0.1

on:
  push:
    branches:
      - feat/cqcl-vnext-t36-nexus-memory
  workflow_dispatch:

jobs:
  cqcl-living:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Run isolated CQCL Living tests
        run: python -m pytest -q tests/test_cqcl_living_v01.py
