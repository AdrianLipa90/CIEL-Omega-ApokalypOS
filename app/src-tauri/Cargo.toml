[package]
name = "ciel-omega"
version = "0.1.0"
description = "CIEL/Ω — Consciousness Integrated Emergent Lattice"
authors = ["Adrian Lipa"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "ciel_omega_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "ciel-omega"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
